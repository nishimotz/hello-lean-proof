[project]
name = "hello-lean-proof-tdd"
version = "0.1.0"
description = "Lean 実行可能仕様を Oracle にする差分テスト（第3部・演習08）"
requires-python = ">=3.12"
dependencies = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.uv]
package = false
